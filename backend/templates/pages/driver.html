{% extends "layouts/base.html" %}
{% block title %}Haydovchi — SmartGaz{% endblock %}
{% block content %}
<div class="sg-container">
  <div class="sg-pwa-shell">
    <h1 class="sg-section-title" style="margin-top:0;">🚛 Haydovchi paneli</h1>
    <div id="alerts"></div>

    <div class="sg-card">
      <div class="sg-flex-between">
        <div>
          <h2 style="margin:0;" id="route-title">Bugungi marshrut yuklanmoqda...</h2>
          <p class="sg-muted" id="route-sub"></p>
        </div>
        <div id="route-actions"></div>
      </div>
    </div>

    <div class="sg-card">
      <h2>📍 GPS holati</h2>
      <div class="sg-flex-between sg-mt-2">
        <div id="gps-status" class="sg-muted">Koordinatalar yuborilmoqda...</div>
        <label class="sg-muted" style="display:flex;align-items:center;gap:6px;font-size:13px;">
          <input type="checkbox" id="gps-toggle" checked> Avto-GPS (har 30 soniyada)
        </label>
      </div>
      <div id="map" style="height:280px; margin-top:12px;"></div>
    </div>

    <div class="sg-card">
      <h2>📋 Buyurtmalar ro'yxati (FIFO)</h2>
      <div id="orders-list"><p class="sg-muted">Yuklanmoqda...</p></div>
    </div>
  </div>
</div>
<script>
let mapInstance = null;
let driverMarker = null;
let gpsTimer = null;
let currentRoute = null;

async function loadRoute(){
  try {
    const r = await SG.api('/routes/today');
    const title = document.getElementById('route-title');
    const sub = document.getElementById('route-sub');
    const actions = document.getElementById('route-actions');
    const list = document.getElementById('orders-list');
    if (!r) {
      title.textContent = 'Bugungi marshrut yo\'q';
      sub.textContent = 'Dispecher sizga marshrut biriktirishini kuting.';
      actions.innerHTML = '';
      list.innerHTML = '<p class="sg-muted">Buyurtmalar yo\'q.</p>';
      return;
    }
    currentRoute = r;
    title.innerHTML = `Marshrut #${r.id} · ${SG.badge(r.status)}`;
    sub.textContent = `${r.allocated_cylinders} ta ballon ajratilgan · ${r.delivered_count} ta yetkazildi · Sana: ${r.route_date}`;

    if (r.status === 'PLANNED') actions.innerHTML = `<button onclick="startRoute(${r.id})" class="sg-btn sg-btn-primary">▶ Marshrutni boshlash</button>`;
    else if (r.status === 'IN_PROGRESS') actions.innerHTML = `<button onclick="finishRoute(${r.id})" class="sg-btn sg-btn-danger">🏁 Yakunlash</button>`;
    else actions.innerHTML = '<span class="sg-badge sg-badge-completed">Yakunlangan</span>';

    list.innerHTML = r.orders.map(o => `
      <div class="sg-order-card ${o.status === 'DELIVERED' ? 'done' : o.status === 'ON_WAY' ? 'onway' : ''}" id="order-${o.id}">
        <div class="sg-flex-between">
          <div><strong>#${o.queue_number} · Buyurtma ${o.id}</strong> ${SG.badge(o.status)}</div>
          <div class="sg-muted">${SG.fmtDateTime(o.requested_at)}</div>
        </div>
        <div style="margin-top:6px; color:#374151;">${o.weight_kg ? 'Og\'irlik: '+o.weight_kg+' kg · Summa: '+(o.price_total||0).toLocaleString()+' so\'m' : 'Manzilga yetib borgach, og\'irlik va to\'lovni kiriting'}</div>
        ${o.status === 'ON_WAY' || o.status === 'APPROVED' ? `
        <div class="sg-mt-2 sg-row" style="grid-template-columns:1fr 1fr auto; gap:8px;">
          <input type="number" step="0.1" min="1" max="30" id="w-${o.id}" placeholder="Og'irlik (kg)" class="sg-input" style="padding:8px 10px;">
          <select id="p-${o.id}" class="sg-select" style="padding:8px 10px;">
            <option value="cash">Naqd</option><option value="lpg_card">LPG karta</option><option value="online">Onlayn</option>
          </select>
          <button onclick="completeOrder(${o.id})" class="sg-btn sg-btn-primary sg-btn-sm">✓ Topshirish</button>
        </div>` : ''}
      </div>
    `).join('');
  } catch(e){ SG.showAlert(e.message,'error'); }
}

async function startRoute(id){
  try { await SG.api(`/routes/${id}/start`,{method:'POST'}); SG.showAlert('Marshrut boshlandi!','success'); await loadRoute(); }
  catch(e){ SG.showAlert(e.message,'error'); }
}
async function finishRoute(id){
  if (!confirm('Marshrutni tugatmoqchimisiz? (topshirilmagan buyurtmalar navbatga qaytadi)')) return;
  try { await SG.api(`/routes/${id}/finish`,{method:'POST'}); SG.showAlert('Marshrut yakunlandi','success'); await loadRoute(); }
  catch(e){ SG.showAlert(e.message,'error'); }
}
async function completeOrder(id){
  const w = document.getElementById('w-'+id).value;
  const p = document.getElementById('p-'+id).value;
  if (!w) return SG.showAlert('Og\'irlikni kiriting','error');
  try {
    await SG.api(`/orders/${id}/complete`, { method:'POST', body:{ weight_kg: parseFloat(w), payment_type: p }});
    SG.showAlert('Buyurtma qayd etildi','success');
    await loadRoute();
  } catch(e){ SG.showAlert(e.message,'error'); }
}

function sendLocation() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const lat = pos.coords.latitude, lon = pos.coords.longitude, sp = pos.coords.speed ? pos.coords.speed*3.6 : 0;
    try {
      await SG.api('/tracking/update-location',{method:'POST', body:{ lat, lon, speed: sp }});
      document.getElementById('gps-status').innerHTML = `<span class="sg-live-dot"></span>Koordinatalar yuborildi: ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
      if (!mapInstance) {
        mapInstance = L.map('map').setView([lat, lon], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM'}).addTo(mapInstance);
      } else { mapInstance.setView([lat,lon]); }
      if (driverMarker) mapInstance.removeLayer(driverMarker);
      driverMarker = L.marker([lat,lon]).addTo(mapInstance).bindPopup('🚛 Sizning joylashuvingiz');
    } catch(e){ document.getElementById('gps-status').textContent = 'Xato: '+e.message; }
  }, (err) => {
    document.getElementById('gps-status').textContent = 'Lokatsiya olinmadi ('+err.message+')';
  }, { enableHighAccuracy:true, timeout:10000 });
}

document.getElementById('gps-toggle').addEventListener('change', (e) => {
  if (gpsTimer) { clearInterval(gpsTimer); gpsTimer=null; }
  if (e.target.checked) { sendLocation(); gpsTimer = setInterval(sendLocation, 30000); }
});

(async function init(){
  await loadRoute();
  sendLocation();
  gpsTimer = setInterval(sendLocation, 30000);
})();
</script>
{% endblock %}
